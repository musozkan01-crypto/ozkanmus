<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nevas | Sistemleriniz. Tek ekranda.</title>
<meta name="description" content="Nevas: mağaza, ERP ve raporlama sistemleriniz tek ekranda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0a0a0b}
  .pcz-root{--pcz-fg:#f2efe9;--pcz-amb:#ffb547;position:fixed;inset:0;overflow:hidden;background:#0a0a0b;color:var(--pcz-fg);
    font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:pan-y}
  .pcz-root canvas,.pcz-root .pcz-fallback{position:absolute;inset:0;width:100%;height:100%;display:block}
  .pcz-root .pcz-fallback{object-fit:contain;object-position:50% 42%;pointer-events:none}
  .pcz-scrim{position:absolute;z-index:1;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 55% 45% at 14% 100%,rgba(10,10,11,.9) 0%,rgba(10,10,11,.6) 45%,rgba(10,10,11,0) 100%)}
  .pcz-copy{position:absolute;z-index:2;left:clamp(20px,3.2vw,48px);bottom:clamp(28px,5vw,64px);max-width:min(720px,88vw);pointer-events:none}
  .pcz-title{margin:0;font-weight:500;font-size:clamp(42px,7vw,112px);line-height:.94;letter-spacing:-.045em;color:var(--pcz-fg)}
  .pcz-title em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(242,239,233,.72)}
  #spacer{height:320vh}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
  @media (max-width:700px){.pcz-copy{bottom:36px}
    .pcz-scrim{background:linear-gradient(0deg,rgba(10,10,11,.92) 0%,rgba(10,10,11,.7) 30%,rgba(10,10,11,0) 55%)}}
</style>
</head>
<body>
<section class="pcz-root" id="pcz-root" aria-label="Nevas">
  <img class="pcz-fallback" id="pcz-fb" src="assets/krom.png" alt="Sıvı krom şerit" width="3966" height="1586">
  <canvas id="pcz-gl" aria-hidden="true"></canvas>
  <div class="pcz-scrim"></div>
  <div class="pcz-copy" id="pcz-copy">
    <h2 class="pcz-title">Sistemleriniz.<br><em>Tek ekranda.</em></h2>
  </div>
</section>
<div id="spacer"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const root=document.getElementById('pcz-root'),canvas=document.getElementById('pcz-gl'),fb=document.getElementById('pcz-fb'),copyEl=document.getElementById('pcz-copy');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=Math.min(innerWidth,innerHeight)<700||/Android|iPhone|iPad/i.test(navigator.userAgent);
const Q=new URLSearchParams(location.search);
const F=+Q.get('f')||(mobile?5000:16000), S=mobile?40:56, DUST=mobile?22000:80000;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};

/* ---------- deterministik rastgele ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11);
const gauss=()=>{let u=0;for(let i=0;i<4;i++)u+=R();return(u-2)*1.7};

/* ---------- şerit omurgası: düğüm eğrisi + paralel taşıma çerçevesi ---------- */
const NT=2048,TAU=Math.PI*2;
const K=.6,cv=a=>[(Math.sin(a)+2*Math.sin(2*a))*.55*K,(Math.cos(a)-2*Math.cos(2*a))*.42*K,-Math.sin(3*a)*.5*K];
const nrm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const tP=new Float32Array((NT+1)*3),tT=new Float32Array((NT+1)*3),tD=new Float32Array((NT+1)*3),tN=new Float32Array((NT+1)*3),tW=new Float32Array(NT+1);
(function(){
  const Ns=[],Bs=[],Ts=[],Ps=[];let N=null;
  for(let k=0;k<=NT;k++){
    const a=TAU*k/NT,e=1e-3,p=cv(a),p1=cv(a+e),p0=cv(a-e);
    const T=nrm([p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]]);
    if(!N)N=nrm(crs(T,[0,0,1]));
    else{const d=dot(N,T);N=nrm([N[0]-T[0]*d,N[1]-T[1]*d,N[2]-T[2]*d]);}
    Ts.push(T);Ps.push(p);Ns.push(N);Bs.push(crs(T,N));
  }
  const th=Math.atan2(dot(Ns[NT],Bs[0]),dot(Ns[NT],Ns[0]));
  for(let k=0;k<=NT;k++){
    const a=TAU*k/NT,ph=.4+(TAU*1-th)*k/NT+.5*Math.sin(2*a+.5);
    const c=Math.cos(ph),s=Math.sin(ph),N=Ns[k],B=Bs[k];
    const D=[c*N[0]+s*B[0],c*N[1]+s*B[1],c*N[2]+s*B[2]];
    const Nr=[-s*N[0]+c*B[0],-s*N[1]+c*B[1],-s*N[2]+c*B[2]];
    for(let j=0;j<3;j++){tP[k*3+j]=Ps[k][j];tT[k*3+j]=Ts[k][j];tD[k*3+j]=D[j];tN[k*3+j]=Nr[j];}
    tW[k]=K*Math.max(.14,.30+.14*Math.sin(2*a+1)+.06*Math.sin(5*a));
  }
})();
const smp=(arr,f,i,j,o)=>{o[0]=arr[i*3]*(1-f)+arr[j*3]*f;o[1]=arr[i*3+1]*(1-f)+arr[j*3+1]*f;o[2]=arr[i*3+2]*(1-f)+arr[j*3+2]*f};
const sP=[0,0,0],sT=[0,0,0],sD=[0,0,0],sN=[0,0,0];
function sample(t){
  t=t-Math.floor(t);const x=t*NT,i=Math.floor(x),f=x-i,j=Math.min(NT,i+1);
  smp(tP,f,i,j,sP);smp(tT,f,i,j,sT);smp(tD,f,i,j,sD);smp(tN,f,i,j,sN);
  return tW[i]*(1-f)+tW[j]*f;
}

/* ---------- teller ---------- */
function buildFibers(){
  const V=S+1,pos=new Float32Array(F*V*3),col=new Uint8Array(F*V*4),idx=new Uint32Array(F*S*2);
  const L1=nrm([-.5,.6,.65]),L2=nrm([.7,-.2,.4]);
  for(let i=0;i<F;i++){
    const u=(R()*2-1),t0=R(),L=.55+.45*Math.pow(R(),.5),bright=.6+.55*R(),dark=R()<.1,hue=Math.pow(R(),.55);
    const ph=R()*TAU,ph2=R()*TAU,fx=[gauss(),gauss(),gauss()],thick=(R()*2-1)*.012*K;
    for(let s=0;s<V;s++){
      const s01=s/S,t=t0+L*s01,w=sample(t);
      const uu=u+.025*Math.sin(t*9+ph)+.012*Math.sin(t*23+ph2);
      const e=Math.pow(Math.abs(s01*2-1),5),fz=.4+.6*(.5+.5*Math.sin(TAU*t+2.1)),fr=.07*K*e*fz;
      const lat=uu*w,nv=thick+.012*K*Math.sin(t*14+ph),o=(i*V+s)*3;
      pos[o]=sP[0]+sD[0]*lat+sN[0]*nv+fx[0]*fr;
      pos[o+1]=sP[1]+sD[1]*lat+sN[1]*nv+fx[1]*fr;
      pos[o+2]=sP[2]+sD[2]*lat+sN[2]*nv+fx[2]*fr;
      const d1=Math.abs(dot(sN,L1)),d2=Math.abs(dot(sN,L2));
      const tl=dot(sT,L1),spec=Math.pow(Math.sqrt(Math.max(0,1-tl*tl)),48)*.9;
      const dif=(.3+.85*d1+.3*d2)*bright*.85*(dark?.3:1);
      const gr=1.0*(1-hue)+.97*hue,gg=.76*(1-hue)+.92*hue,gb=.46*(1-hue)+.82*hue;
      const c=(v,sp)=>Math.min(255,(v*dif+sp*spec)*255);
      const q=(i*V+s)*4;
      col[q]=c(gr,1);col[q+1]=c(gg,.97);col[q+2]=c(gb,.9);
      col[q+3]=255*clamp(sstep(0,.08,s01)*sstep(0,.08,1-s01)+.0,0,1);
    }
    for(let s=0;s<S;s++){const k=(i*S+s)*2;idx[k]=i*V+s;idx[k+1]=i*V+s+1;}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aCol',new THREE.BufferAttribute(col,4,true));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  return g;
}

/* ---------- toz ve damlalar ---------- */
function buildDust(){
  const pos=new Float32Array(DUST*3),siz=new Float32Array(DUST),col=new Float32Array(DUST*3),ph=new Float32Array(DUST);
  for(let i=0;i<DUST;i++){
    let x,y,z;
    if(R()<.55){
      const sg=R()<.5?-1:1;x=sg*(.45+Math.abs(gauss())*.85);y=gauss()*.2*(1+Math.abs(x)*.4)+.08*Math.sin(x*3);z=gauss()*.35;
    }else{
      sample(R());const sp=.1;x=sP[0]+gauss()*sp;y=sP[1]+gauss()*sp;z=sP[2]+gauss()*sp;
    }
    pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;ph[i]=R()*TAU;
    siz[i]=.7+Math.pow(R(),22)*9;
    const b=.45+.75*R(),w=R()*.35;
    col[i*3]=b*(1-.1*w);col[i*3+1]=b*(.72+.25*w);col[i*3+2]=b*(.4+.4*w);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aS',new THREE.BufferAttribute(siz,1));
  g.setAttribute('aC',new THREE.BufferAttribute(col,3));
  g.setAttribute('aP',new THREE.BufferAttribute(ph,1));
  return g;
}

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});}
catch(e){renderer=null}
if(!renderer){/* WebGL yok: görsel yedek kalır */}
else{
  renderer.setClearColor(0x0a0a0b,1);
  renderer.toneMapping=THREE.NoToneMapping;
  let DPR=Math.min(devicePixelRatio||1,mobile?2:2.5);
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.02,40);
  const uni={uM:{value:new THREE.Vector2(9,9)},uStr:{value:0},uAsp:{value:1},uDpr:{value:DPR},uCamD:{value:4.6},uT:{value:0}};
  const fg=buildFibers(),dg=buildDust();
  const fiberMat=new THREE.ShaderMaterial({uniforms:uni,transparent:false,alphaToCoverage:true,depthWrite:true,
    vertexShader:`attribute vec4 aCol;uniform vec2 uM;uniform float uStr,uAsp;varying vec4 vC;
      void main(){vC=aCol;vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);
        vec2 d=p.xy/p.w-uM;d.x*=uAsp;float k=uStr*exp(-dot(d,d)*18.);
        p.xy+=normalize(d+1e-4)*k*.05*p.w;gl_Position=p;}`,
    fragmentShader:`varying vec4 vC;void main(){gl_FragColor=vec4(vC.rgb,vC.a);}`});
  const lines=new THREE.LineSegments(fg,fiberMat);lines.frustumCulled=false;scene.add(lines);
  const dustMat=new THREE.ShaderMaterial({uniforms:uni,transparent:true,depthWrite:false,
    vertexShader:`attribute float aS;attribute vec3 aC;attribute float aP;uniform vec2 uM;uniform float uStr,uAsp,uDpr,uCamD,uT;
      varying vec3 vC;varying float vS;
      void main(){vC=aC;vec3 q=position+vec3(sin(uT*.35+aP),cos(uT*.3+aP*1.3),sin(uT*.25+aP*.7))*.012;
        vec4 mv=modelViewMatrix*vec4(q,1.);vec4 p=projectionMatrix*mv;
        vec2 d=p.xy/p.w-uM;d.x*=uAsp;float k=uStr*exp(-dot(d,d)*14.);
        p.xy+=normalize(d+1e-4)*k*.09*p.w;gl_Position=p;
        float s=aS*uCamD/max(.05,-mv.z);vS=aS;
        gl_PointSize=clamp(s*uDpr,1.,72.*uDpr);}`,
    fragmentShader:`varying vec3 vC;varying float vS;
      void main(){vec2 uv=(gl_PointCoord-.5)*2.;float d=length(uv);if(d>1.)discard;
        if(vS>6.){vec3 n=vec3(uv.x,-uv.y,sqrt(max(0.,1.-d*d)));vec3 L=normalize(vec3(-.4,.6,.7));
          float df=max(dot(n,L),0.);float sp=pow(max(dot(reflect(-L,n),vec3(0.,0.,1.)),0.),40.);
          float fr=pow(1.-n.z,2.);vec3 c=vC*(.3+.95*df)+sp*.9+vec3(1.,.7,.35)*fr*.35;
          gl_FragColor=vec4(c,mix(.62,.95,fr));}
        else gl_FragColor=vec4(vC,smoothstep(1.,.55,d)*.92);}`});
  const dust=new THREE.Points(dg,dustMat);dust.frustumCulled=false;scene.add(dust);

  /* ---------- boyut, kaydırma, imleç ---------- */
  function resize(){
    const w=innerWidth,h=innerHeight;renderer.setPixelRatio(DPR);renderer.setSize(w,h,false);
    cam.aspect=w/h;cam.updateProjectionMatrix();uni.uAsp.value=w/h;uni.uDpr.value=DPR;
    cam.fov=w/h<.9?Math.min(62,46+(.9-w/h)*70):32;cam.updateProjectionMatrix();
  }
  addEventListener('resize',resize);resize();
  const mT=new THREE.Vector2(9,9);let strT=0,idle=0;
  root.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&e.buttons===0)return;mT.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1));strT=1;idle=0;},{passive:true});
  root.addEventListener('pointerleave',()=>{strT=0;},{passive:true});
  const mS=new THREE.Vector2(0,0);

  /* yakınlaşma hedefi: şeridin yüzeyine 0.55 mesafe */
  sample(.30);const NEAR_T=[sP[0],sP[1],sP[2]],NEAR_N=[sN[0],sN[1],sN[2]],NEAR_D=[sD[0],sD[1],sD[2]];
  const nearPos=new THREE.Vector3(NEAR_T[0]+NEAR_N[0]*.5+NEAR_D[0]*.12,NEAR_T[1]+NEAR_N[1]*.5+NEAR_D[1]*.12,NEAR_T[2]+NEAR_N[2]*.5+NEAR_D[2]*.12);
  const nearTgt=new THREE.Vector3(...NEAR_T),farPos=new THREE.Vector3(0,.05,4.6),farTgt=new THREE.Vector3(0,.04,0);
  const cp=new THREE.Vector3(),ct=new THREE.Vector3(),off=new THREE.Vector3();
  let prog=0,progS=0,T=0,last=performance.now();

  /* ---------- uyarlanır kalite ---------- */
  let aT=0,aN=0,aTier=0,aSkip=0,fibK=F,dustK=DUST;
  function adapt(dt){
    if(aSkip>0){aSkip--;return}aT+=dt;aN++;if(aN<45)return;
    const avg=aT/aN;aT=0;aN=0;if(avg<=.026||aTier>=4)return;
    aTier++;aSkip=20;
    if(aTier===1){dustK=Math.floor(DUST*.6)}
    else if(aTier===2){fibK=Math.floor(F*.65)}
    else if(aTier===3&&DPR>1.5){DPR=1.5;resize()}
    else if(aTier===4){fibK=Math.floor(F*.4);dustK=Math.floor(DUST*.35);if(DPR>1.25){DPR=1.25;resize()}}
    fg.setDrawRange(0,fibK*S*2);dg.setDrawRange(0,dustK);
  }

  function tick(){
    if(window.__paused)return;
    const now=performance.now();if(now-(window.__lt||0)<13)return;window.__lt=now;
    const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt;uni.uT.value=T;
    const sc=document.documentElement,max=sc.scrollHeight-innerHeight;
    prog=max>2?clamp(scrollY/max,0,1):0;progS+=(prog-progS)*(1-Math.pow(.001,dt));
    const e=progS*progS*(3-2*progS);
    mS.lerp(mT.x>8?mS:mT,.06);idle+=dt;
    uni.uM.value.lerp(mT,.35);uni.uStr.value+=(strT-uni.uStr.value)*.08;if(idle>1.8)strT=0;
    const camD=4.6+(.5-4.6)*e;uni.uCamD.value=Math.max(.5,camD);
    cp.lerpVectors(farPos,nearPos,e);ct.lerpVectors(farTgt,nearTgt,e);
    const az=(Math.sin(T*.12)*.28+mS.x*.35)*(1-e),el=(mS.y*.18)*(1-e);
    off.copy(cp).sub(ct);
    const ca=Math.cos(az),sa=Math.sin(az),ox=off.x*ca+off.z*sa,oz=-off.x*sa+off.z*ca;
    off.set(ox,off.y+Math.sin(el)*off.length()*.6,oz);
    cam.position.copy(ct).add(off);cam.lookAt(ct);
    copyEl.style.opacity=String(1-sstep(0,.22,progS));
    renderer.render(scene,cam);
    adapt(dt);
    if(!window.__ok){window.__ok=true;fb.style.display='none';}
  }
  let running=false;
  function start(){if(running)return;running=true;last=performance.now();renderer.setAnimationLoop(tick);}
  function stop(){running=false;renderer.setAnimationLoop(null);}
  window.parcacikStart=start;window.parcacikStop=stop;
  window.__pcz={get tier(){return aTier},get prog(){return progS},tick};
  if(reduce){tick();tick();fb.style.display='none'}else start();
}
</script>
</body>
</html>
